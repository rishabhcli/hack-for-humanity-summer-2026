name: verify

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify-all
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.dev/cache/ms-playwright

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version-file: .node-version

      - name: Bootstrap locked repository and browser
        run: npm run bootstrap

      - name: Install Playwright system dependencies
        run: node node_modules/playwright/cli.js install-deps chromium

      - name: Run repository verification
        run: |
          mkdir -p .dev/logs
          set -o pipefail
          npm run verify-all 2>&1 | tee .dev/logs/verify-all-ci.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .dev/logs/
            .dev/pw-profile/test-results/
            coverage/
            evidence/tier-0/
          retention-days: 14
